# PR と main への push で、秘密情報の確認、バックエンドの lint とテスト、フロントエンドの lint・整形の確認・テスト・ビルドを動かす。
# backend/requirements-dev.txt・frontend/package-lock.json がまだない間は、その job は何もせずに成功する
# （骨格ができた時点で自動で動き出す）。
# 外部サービス（OpenRouter・Stripe・メール）はテストではモックにし、学校配布の API キーは使わない。
# E2E（Playwright）は、画面ができたら job を足す。
name: CI

on:
  pull_request:
  push:
    branches: [main]

# リポジトリの中身を読むだけにする（権限を最小にする）
permissions:
  contents: read

jobs:
  # .githooks を有効にしていない人のコミットも確かめるため、PR の差分全体を scripts/check-secrets.sh で見る
  secrets:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 秘密情報の確認
        run: sh scripts/check-secrets.sh "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: バックエンドがあるかを確認
        id: exists
        run: |
          if [ -f requirements-dev.txt ]; then echo "found=true" >> "$GITHUB_OUTPUT"; else echo "backend/requirements-dev.txt がないため、スキップします"; fi
      - if: steps.exists.outputs.found == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - if: steps.exists.outputs.found == 'true'
        run: pip install -r requirements-dev.txt
      - name: Lint（ruff）
        if: steps.exists.outputs.found == 'true'
        run: |
          ruff check .
          ruff format --check .
      - name: Test（pytest）
        if: steps.exists.outputs.found == 'true'
        run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: フロントエンドがあるかを確認
        id: exists
        run: |
          if [ -f package-lock.json ]; then echo "found=true" >> "$GITHUB_OUTPUT"; else echo "frontend/package-lock.json がないため、スキップします"; fi
      - if: steps.exists.outputs.found == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: steps.exists.outputs.found == 'true'
        run: npm ci
      - name: Lint（ESLint）
        if: steps.exists.outputs.found == 'true'
        run: npm run lint
      - name: 整形の確認（Prettier）
        if: steps.exists.outputs.found == 'true'
        run: npm run format:check
      - name: Test（Vitest）
        if: steps.exists.outputs.found == 'true'
        run: npm run test --if-present
      - name: ビルド（型チェックを含む）
        if: steps.exists.outputs.found == 'true'
        run: npm run build
