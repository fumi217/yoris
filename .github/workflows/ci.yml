# PR と main への push で、秘密情報の確認、バックエンドの lint とテスト、フロントエンドの lint・整形の確認・テスト・ビルドを動かす。
# backend/requirements-dev.txt・frontend/package-lock.json がまだない間は、その job は何もせずに成功する
# （骨格ができた時点で自動で動き出す）。
# 外部サービス（OpenRouter・Stripe・メール）はテストではモックにし、学校配布の API キーは使わない。
# E2E（Playwright）は、画面ができたら job を足す。
name: CI

on:
  pull_request:
  push:
    branches: [main]

# リポジトリの中身を読むだけにする（権限を最小にする）
permissions:
  contents: read

jobs:
  # .githooks を有効にしていない人のコミットも確かめるため、PR の差分全体を scripts/check-secrets.sh で見る
  secrets:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 秘密情報の確認
        run: sh scripts/check-secrets.sh "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # テストは本物の PostgreSQL と Redis を使う（spec 001 の research.md R-19）。版は docker-compose.yml と同じ。
    # 中身は CI の中だけで使う使い捨ての値（秘密ではない）
    services:
      db:
        image: postgres:18
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8.10
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/app
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - name: バックエンドがあるかを確認
        id: exists
        run: |
          if [ -f requirements-dev.txt ]; then echo "found=true" >> "$GITHUB_OUTPUT"; else echo "backend/requirements-dev.txt がないため、スキップします"; fi
      - if: steps.exists.outputs.found == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - if: steps.exists.outputs.found == 'true'
        run: pip install -r requirements-dev.txt
      - name: Lint（ruff）
        if: steps.exists.outputs.found == 'true'
        run: |
          ruff check .
          ruff format --check .
      # 2 人が同時にマイグレーションを作ると、親がぶつかって head が 2 つになる（spec 001 の research.md R-17・T090）
      - name: マイグレーションの head が 1 つか
        if: steps.exists.outputs.found == 'true'
        run: |
          alembic heads
          heads=$(alembic heads 2>/dev/null | wc -l)
          if [ "$heads" -ne 1 ]; then
            echo "alembic の head が ${heads} 個あります。main を取り込み、alembic merge heads で 1 つにまとめてください"
            exit 1
          fi
      - name: マイグレーション（テストの前にテーブルを作る）
        if: steps.exists.outputs.found == 'true'
        run: alembic upgrade head
      - name: Test（pytest）
        if: steps.exists.outputs.found == 'true'
        run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: フロントエンドがあるかを確認
        id: exists
        run: |
          if [ -f package-lock.json ]; then echo "found=true" >> "$GITHUB_OUTPUT"; else echo "frontend/package-lock.json がないため、スキップします"; fi
      - if: steps.exists.outputs.found == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: steps.exists.outputs.found == 'true'
        run: npm ci
      - name: Lint（ESLint）
        if: steps.exists.outputs.found == 'true'
        run: npm run lint
      - name: 整形の確認（Prettier）
        if: steps.exists.outputs.found == 'true'
        run: npm run format:check
      - name: Test（Vitest）
        if: steps.exists.outputs.found == 'true'
        run: npm run test --if-present
      - name: ビルド（型チェックを含む）
        if: steps.exists.outputs.found == 'true'
        run: npm run build
