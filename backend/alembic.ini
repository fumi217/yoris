# Alembic（マイグレーション）の設定。使い方は backend/README.md の「マイグレーション」を見る。
# DB の場所は、ここではなく環境変数 DATABASE_URL から読む（alembic/env.py）。

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os
# ファイル名の先頭に日付を付け、作った順に並ぶようにする（例：20261021_1530_ab12cd34ef56_core_tables.py）
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[post_write_hooks]
# 作ったマイグレーションを ruff で整える（CI の ruff format --check で落ちないように）
hooks = ruff_format, ruff_fix
ruff_fix.type = exec
ruff_fix.executable = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
